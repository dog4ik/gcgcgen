[workspace]
members = ["crates/*"]

[package]
name = "gcgcgen"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8.9", optional = true, features = ["macros"] }
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.0", features = ["nightly"] }
leptos_router = { version = "0.8.0", features = ["nightly"] }
leptos_meta = { version = "0.8.0" }
leptos_axum = { version = "0.8.0", optional = true }
time = { version = "0.3.55", features = ["serde-human-readable"] }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
], optional = true }
tower = { version = "0.5.3", optional = true, features = ["util"] }
wasm-bindgen = "0.2.93"
thiserror = "2.0.12"
tracing = { version = "0.1.40", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true, features = [
  "json",
  "serde_json",
  "serde",
  "time",
  "fmt",
  "env-filter",
] }
http = "1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = [
  "runtime-tokio",
  "macros",
  "migrate",
  "json",
  "time",
  "sqlite",
] }
base64 = "0.23.1"
connect = { path = "crates/connect" }
mahoraga = { version = "0.3.0", features = ["serde_json"] }
hmac = "0.13.0"
sha2 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
form_urlencoded = "1.2.2"
aes = { version = "0.9.1", optional = true }
cbc = { version = "0.2.1", features = ["alloc"], optional = true }
rand = { version = "0.10.2", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"], optional = true }
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"], optional = true }
dotenvy = { version = "0.15.7", optional = true }

[features]
hydrate = ["leptos/hydrate"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:leptos_axum",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:sqlx",
  "dep:reqwest",
  "dep:aes",
  "dep:cbc",
  "dep:rand",
  "dep:axum-extra",
  "dep:dotenvy",
]

[dev-dependencies]
wiremock = "0.6.5"

[package.metadata.cargo-all-features]
denylist = [
  "axum",
  "tokio",
  "tower",
  "leptos_axum",
  "tracing-subscriber",
  "sqlx",
  "reqwest",
  "aes",
  "cbc",
  "rand",
  "axum-extra",
]
skip_feature_sets = [["ssr", "hydrate"], []]

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "gcgcgen"
# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"
# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"
# The tailwind input file.
#
# Optional, Activates the tailwind build
tailwind-input-file = "input.css"

# [Optional] Files in the asset-dir will be copied to the site-root directory
assets-dir = "public"
# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "0.0.0.0:64476"
# The port to use for automatic reload monitoring
reload-port = 3231

# The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false
